name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required by the ruleset on main.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Claude Code CLI (official plugin validator)
        run: npm install -g @anthropic-ai/claude-code
      - run: just setup
      - run: just lint
      - run: just test
      - run: just build
        env:
          REQUIRE_CLAUDE: "1"

  # The plugin must work for everyone: run the tooling on every OS.
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: just setup
      - run: just lint
      - run: just test
