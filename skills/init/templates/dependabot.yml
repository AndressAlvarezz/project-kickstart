# Template: adapt before writing to .github/dependabot.yml.
# Placeholder: <ecosystem> is the stack's package ecosystem (npm, pip, cargo,
# gomod, maven...). Delete that entry if the stack has no package manager.
# Keep the github-actions entry.
version: 2
updates:
  - package-ecosystem: <ecosystem>
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
