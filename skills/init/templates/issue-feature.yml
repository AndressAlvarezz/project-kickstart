name: Feature request
description: Propose a new capability or improvement
title: "feat: "
labels: [feature, needs-plan]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What problem does this solve, and for whom?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable conditions that mean this is done.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes / alternatives considered
    validations:
      required: false
