name: Bug report
description: Something does not work as expected
title: "fix: "
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include error messages or logs.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, versions and anything else relevant.
    validations:
      required: false
